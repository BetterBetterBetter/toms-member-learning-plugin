name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.0"
          tools: none
      - name: Lint all PHP files
        run: |
          set -e
          error=0
          while IFS= read -r -d '' f; do
            if ! php -l "$f" > /dev/null 2>&1; then
              echo "SYNTAX ERROR: $f"
              php -l "$f" || true
              error=1
            fi
          done < <(find . -name '*.php' -not -path './plugin-update-checker/*' -print0)
          exit $error
